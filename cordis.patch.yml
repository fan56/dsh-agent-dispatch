# dsh-jev-dispatch bundle patch: mounts the ex-ante dispatch plugin under the
# stable id `dsh-jev-dispatch`. It joins the `agent/pre-step` waterfall
# (prepend, so its message is appended after every downstream listener's) and,
# for turns that explicitly ask for a verdict, asks TypeSafe's Jev whether the
# task belongs to a registered agent and which one — then injects a four-line
# recommendation the agent may ignore.
#
# The plugin owns no delegation machinery: `use_agent` (dsh-subagent-registry)
# does the spawning, and the capability gate probes its live visibility at
# request time. It ships OFF (`mode: off`): switch a profile to `once` to get
# verdict-on-request via `/dispatch` or `/jev`, and enable a jev key
# (keychain-first, see README) or the plugin stays silent.

- insert:
    - id: dsh-jev-dispatch
      name: '@aiwayds/dsh-jev-dispatch'
      config: {}
