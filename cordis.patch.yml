# dsh-agent-dispatch bundle patch: mounts the ex-ante dispatch plugin under the
# stable id `dsh-agent-dispatch`. It joins the `agent/pre-step` waterfall
# (prepend, so its message is appended after every downstream listener's) and,
# for turns that explicitly ask for a verdict, asks TypeSafe's Jev whether the
# task belongs to a registered agent and which one — then injects a four-line
# recommendation the agent may ignore.
#
# The plugin owns no delegation machinery: `use_agent` (dsh-subagent-registry)
# does the spawning, and the capability gate probes its live visibility at
# request time. It ships OFF (`mode: off`, no listener, zero calls, zero data
# shared): switch a profile to `once` for verdict-on-request via `/dispatch` or
# `/jev`, or to `auto` to ALSO cover ordinary turns — `auto` runs a purely local
# keyword gate first (string matching against `autoKeywords`, no network, no
# clock) and only a turn that hits a keyword is worth a jev call; a turn that
# hits nothing stays completely silent (no call, no injection, no log line).
# `auto` needs a non-empty `autoKeywords` (an empty gate can never fire and is
# rejected at load) and really wants a `logDir`, the only place a keyword hit's
# cost becomes visible. Enable a jev key (keychain-first, see README) either
# way, or the plugin stays silent.

- insert:
    - id: dsh-agent-dispatch
      name: '@aiwayds/dsh-agent-dispatch'
      config: {}
